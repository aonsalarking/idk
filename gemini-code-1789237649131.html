<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Areej ✨</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500;1,600&family=Montserrat:wght@300;400;500;600&display=swap');

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: #0c101d;
            font-family: 'Cormorant Garamond', serif;
            text-align: center;
            overflow: hidden;
            overscroll-behavior-y: contain;
            color: #ffffff;
            transition: background-color 2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Ambient Dynamic Color Themes per Slide */
        body.bg-slide-1 { background-color: #0b0f19; }
        body.bg-slide-2 { background-color: #1a0f1d; }
        body.bg-slide-3 { background-color: #1f040a; }

        /* --- CINEMATIC AMBIENT GLOW ORBS --- */
        .ambient-glow {
            position: absolute;
            width: 60vw;
            height: 60vw;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
            opacity: 0.15;
            transition: all 2s ease-in-out;
            pointer-events: none;
        }
        #glow-1 { top: -20%; left: -20%; background: #4a6fa5; }
        #glow-2 { bottom: -20%; right: -20%; background: #9c528b; }

        /* --- SUBTLE STAR / PARTICLE FIELD --- */
        .space {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image:
                radial-gradient(1.5px 1.5px at 25px 35px, rgba(255,255,255,0.8), rgba(0,0,0,0)),
                radial-gradient(1px 1px at 100px 50px, rgba(255,255,255,0.6), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 180px 140px, rgba(255,255,255,0.7), rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 320px 220px, rgba(255,255,255,0.5), rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 400px 400px;
            z-index: 2;
            opacity: 0.3;
            animation: driftStars 15s linear infinite alternate;
            pointer-events: none;
        }

        @keyframes driftStars {
            0% { transform: translateY(0px) translateX(0px); }
            100% { transform: translateY(-25px) translateX(15px); }
        }

        /* --- MASSIVE SHY WATERMARK BACKGROUND --- */
        #big-shy-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            font-size: 26rem;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
            z-index: 3;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease, transform 1s ease;
            filter: drop-shadow(0 0 60px rgba(255, 255, 255, 0.05));
        }

        #big-shy-bg.visible {
            opacity: 0.09;
            animation: majesticPulse 5s infinite ease-in-out;
        }

        @keyframes majesticPulse {
            0% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.06); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        /* --- FULL-SCREEN iOS EMOJI STREAM --- */
        #emoji-container, #click-effect-container {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            overflow: hidden;
            z-index: 4;
        }

        .floating-emoji {
            position: absolute;
            user-select: none;
            will-change: transform, opacity;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", sans-serif;
            animation: floatUp linear forwards;
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.35));
        }

        @keyframes floatUp {
            0% { transform: translateY(105vh) scale(0.4) rotate(-25deg); opacity: 0; }
            15% { opacity: 0.9; }
            85% { opacity: 0.9; }
            100% { transform: translateY(-15vh) scale(1.25) rotate(30deg); opacity: 0; }
        }

        /* --- INTERACTIVE CLICK SPARKLE BURST --- */
        .click-sparkle {
            position: absolute;
            font-size: 1.5rem;
            pointer-events: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple Color Emoji", sans-serif;
            animation: sparkleBurst 0.8s ease-out forwards;
        }

        @keyframes sparkleBurst {
            0% { transform: translate(0, 0) scale(0.5); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(1.3); opacity: 0; }
        }

        /* --- MASTERPIECE GLASS CARD CONTAINER --- */
        .slide-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            perspective: 1000px;
        }

        .slide {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 50px 35px;
            width: 88%;
            max-width: 420px;
            
            background: rgba(255, 255, 255, 0.025);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            
            opacity: 0;
            visibility: hidden;
            transform: scale(0.9) translateY(30px);
            transition: all 1.1s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform, opacity;
        }

        .slide.active {
            opacity: 1;
            visibility: visible;
            transform: scale(1) translateY(0);
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 400;
            margin-bottom: 45px;
            line-height: 1.45;
            letter-spacing: 0.6px;
            color: #ffffff;
            text-shadow: 0 2px 15px rgba(0, 0, 0, 0.4);
        }

        /* --- EXCLUSIVE DRAMATIC FINALE ANIMATION ON SLIDE 3 --- */
        .slide#slide3.active h1 {
            font-size: 3.3rem;
            font-weight: 600;
            animation: dramaticZoomIn 1.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, heartbeatGlow 2.2s infinite ease-in-out 1.4s;
            text-shadow: 0 0 30px rgba(255, 60, 90, 0.9), 0 0 60px rgba(255, 0, 60, 0.5);
            color: #ffccd5;
        }

        @keyframes dramaticZoomIn {
            0% { transform: scale(0.1); opacity: 0; filter: blur(15px); }
            60% { transform: scale(1.12); opacity: 1; filter: blur(0px); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes heartbeatGlow {
            0% { transform: scale(1); text-shadow: 0 0 30px rgba(255, 60, 90, 0.9); }
            50% { transform: scale(1.07); text-shadow: 0 0 45px rgba(255, 60, 90, 1), 0 0 80px rgba(255, 0, 60, 0.7); }
            100% { transform: scale(1); text-shadow: 0 0 30px rgba(255, 60, 90, 0.9); }
        }

        /* --- LUXURY INTERACTIVE BUTTON --- */
        button {
            position: relative;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.04));
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 16px 48px;
            font-size: 0.9rem;
            font-family: 'Montserrat', sans-serif;
            font-weight: 500;
            letter-spacing: 3.5px;
            text-transform: uppercase;
            border-radius: 50px;
            cursor: pointer;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        button::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }

        button:hover::before {
            left: 100%;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(255,255,255,0.1);
        }

        button:active {
            transform: scale(0.95) translateY(0);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body class="bg-slide-1">

    <div class="ambient-glow" id="glow-1"></div>
    <div class="ambient-glow" id="glow-2"></div>
    <div class="space"></div>
    
    <div id="big-shy-bg">🥺</div>
    <div id="emoji-container"></div>
    <div id="click-effect-container"></div>

    <div class="slide-container">
        <!-- Slide 1 with Typewriter Hook -->
        <div id="slide1" class="slide active">
            <h1 id="typewriter-text"></h1>
            <button onclick="nextSlide(2)">Click me</button>
        </div>

        <!-- Slide 2 -->
        <div id="slide2" class="slide">
            <h1>I'm kinda shy...<br>click me again</h1>
            <button onclick="nextSlide(3)">Click me</button>
        </div>

        <!-- Slide 3 -->
        <div id="slide3" class="slide">
            <h1>I THINK I LOVE YOU ❤️</h1>
            <button onclick="nextSlide(1)">Restart</button>
        </div>
    </div>

    <script>
        let emojiInterval = null;

        const shyEmojis = ['🥺', '✨', '👉👈', '🤍', '🙈', '☁️', '🫣'];
        const heartEmojis = ['❤️', '💖', '💕', '💗', '💓', '✨', '🤍', '💌'];
        const sparkleEmojis = ['✨', '💖', '⭐', '🤍'];

        // Cinematic Typewriter Hook Effect for Slide 1
        const fullText = "Hey Areej, this is from Haider. I wanted to tell you something...";
        let charIndex = 0;

        function typeWriter() {
            if (charIndex < fullText.length) {
                document.getElementById("typewriter-text").innerHTML += fullText.charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, 55); // Speed of typing
            }
        }

        function clearEmojis() {
            if (emojiInterval) {
                clearInterval(emojiInterval);
                emojiInterval = null;
            }
            const container = document.getElementById('emoji-container');
            container.innerHTML = '';
        }

        function startEmojiStream(emojiList, countPerBatch, delayMs) {
            clearEmojis();
            const container = document.getElementById('emoji-container');

            function spawnBatch() {
                for (let i = 0; i < countPerBatch; i++) {
                    const el = document.createElement('div');
                    el.classList.add('floating-emoji');
                    el.innerText = emojiList[Math.floor(Math.random() * emojiList.length)];
                    
                    el.style.fontSize = (Math.random() * 1.2 + 1.3) + 'rem';
                    el.style.left = (Math.random() * 92 + 4) + '%';
                    
                    const duration = (Math.random() * 4 + 4.5);
                    el.style.animationDuration = duration + 's';

                    container.appendChild(el);

                    setTimeout(() => {
                        el.remove();
                    }, duration * 1000);
                }
            }

            spawnBatch();
            emojiInterval = setInterval(spawnBatch, delayMs);
        }

        function nextSlide(slideNumber) {
            const slides = document.querySelectorAll('.slide');
            slides.forEach(slide => slide.classList.remove('active'));

            const targetSlide = document.getElementById('slide' + slideNumber);
            const bigShyBg = document.getElementById('big-shy-bg');
            
            document.body.className = 'bg-slide-' + slideNumber;

            if (slideNumber === 1 || slideNumber === 2) {
                bigShyBg.classList.add('visible');
            } else {
                bigShyBg.classList.remove('visible');
            }

            if (targetSlide) {
                setTimeout(() => {
                    targetSlide.classList.add('active');

                    if (slideNumber === 1 || slideNumber === 2) {
                        startEmojiStream(shyEmojis, 4, 350);
                    } else if (slideNumber === 3) {
                        startEmojiStream(heartEmojis, 7, 220);
                    }
                }, 120); 
            }
        }

        // Initialize Masterpiece & Typewriter on Load
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('big-shy-bg').classList.add('visible');
            startEmojiStream(shyEmojis, 4, 350);
            typeWriter();
        });

        // Interactive Click / Touch Burst Sparkle Effect Anywhere on Screen
        document.addEventListener('click', (e) => {
            const container = document.getElementById('click-effect-container');
            const burstCount = 6;
            
            for (let i = 0; i < burstCount; i++) {
                const sparkle = document.createElement('div');
                sparkle.classList.add('click-sparkle');
                sparkle.innerText = sparkleEmojis[Math.floor(Math.random() * sparkleEmojis.length)];
                
                sparkle.style.left = e.clientX + 'px';
                sparkle.style.top = e.clientY + 'px';
                
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 80 + 30;
                const dx = Math.cos(angle) * distance;
                const dy = Math.sin(angle) * distance;
                
                sparkle.style.setProperty('--dx', dx + 'px');
                sparkle.style.setProperty('--dy', dy + 'px');
                
                container.appendChild(sparkle);
                
                setTimeout(() => {
                    sparkle.remove();
                }, 800);
            }
        });

        // Parallax Effect on Mouse Move / Touch
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 15;
            const y = (e.clientY / window.innerHeight - 0.5) * 15;
            const activeSlide = document.querySelector('.slide.active');
            if (activeSlide) {
                activeSlide.style.transform = `translate(${x}px, ${y}px) scale(1)`;
            }
        });
    </script>

</body>
</html>
